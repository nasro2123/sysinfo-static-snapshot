<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Serials</title>
  <desc id="desc">Purple digital serial key card illustration</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17102d"/><stop offset="1" stop-color="#080611"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b337ff"/><stop offset="1" stop-color="#6e16cf"/></linearGradient>
    <filter id="shadow"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1200" height="600" rx="28" fill="url(#bg)"/>
  <circle cx="180" cy="120" r="190" fill="#9c28ff" opacity=".18" filter="url(#shadow)"/>
  <path d="M0 480C210 300 350 530 540 360s330-50 660-220v460H0Z" fill="#7717bd" opacity=".14"/>
  <g transform="translate(225 120) rotate(-7 375 180)">
    <rect width="750" height="360" rx="30" fill="#21123d" stroke="#b337ff" stroke-opacity=".7" stroke-width="3"/>
    <rect x="32" y="32" width="686" height="296" rx="20" fill="none" stroke="#8f32db" stroke-opacity=".35" stroke-dasharray="10 13"/>
    <circle cx="112" cy="112" r="43" fill="url(#glow)" opacity=".9"/>
    <path d="M112 87v50m-25-25h50" stroke="white" stroke-width="10" stroke-linecap="round" opacity=".9"/>
    <text x="188" y="118" fill="#fff" font-family="Arial,sans-serif" font-size="40" font-weight="700">SERIAL KEY</text>
    <text x="76" y="230" fill="#d8b7f4" font-family="monospace" font-size="30" letter-spacing="6">SYSI • 7F4K • 9Q2M</text>
    <path d="M76 270h598" stroke="#b337ff" stroke-opacity=".5" stroke-width="3"/>
    <text x="76" y="306" fill="#a77bc7" font-family="Arial,sans-serif" font-size="18" letter-spacing="3">INSTANT DELIVERY</text>
  </g>
</svg>
